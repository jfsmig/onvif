# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/2.0/configuration-reference
version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/go:1.26
    steps:
      - checkout
      - run: go install ./...
      # -race, because the sdk fans out every independent fetch against one camera and
      # nothing else here can catch a data race: no camera runs in CI, so the race
      # detector over the stub-device tests is the only automated check on the fan-out.
      - run: go test -race ./...
      - run: go vet ./...
      # The rules a script can decide, rather than a reviewer: the AGPL notice and the blank
      # line after it, the MIT provenance set, the ban on the standard logger below sdk, and
      # the calls.txt-to-wrapper counts. The same script runs from a Stop hook while an agent
      # works; this is what enforces it on a human pull request, where no hook fires.
      - run: scripts/repo-check.sh
      - run:
          name: "Check the formatting"
          command: |
            set -euo pipefail
            unformatted="$(gofmt -l .)"
            if [ -n "${unformatted}" ]; then
              echo "gofmt -l reported:" >&2
              echo "${unformatted}" >&2
              exit 1
            fi
      - run:
          name: "Check the generated files have been commit"
          command: |
            set -euxo pipefail
            go generate ./...
            git diff --quiet --exit-code

workflows:
  build-and-test-workflow:
    jobs:
      - build-and-test
